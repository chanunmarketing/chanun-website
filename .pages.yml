# หน้าแอดมินของเว็บ CHANUN (Pages CMS — https://app.pagescms.org)
# ช่องที่ลงท้ายด้วย (TH) คือภาษาไทย (EN) คือภาษาอังกฤษ
# ถ้าเว้นช่อง EN ว่างไว้ หน้าเว็บภาษาอังกฤษจะแสดงข้อความภาษาไทยแทน

media:
  input: public/uploads
  output: /uploads
  rename: safe
  categories: [image]

content:
  - name: services
    label: บริการและราคา
    type: collection
    path: src/content/services
    filename: "{fields.name_en}.md"
    view:
      fields: [name_en, category, price_from, featured, published]
      primary: name_en
      sort: [order, name_en]
      default:
        sort: order
        order: asc
    fields:
      - name: name_en
        label: ชื่อโปรแกรม
        description: ภาษาอังกฤษ ใช้เป็นชื่อหลักบนเว็บ เช่น Program Skin Trio
        type: string
        required: true
      - name: name_th
        label: ชื่อภาษาไทย
        description: บรรทัดเล็กใต้ชื่อโปรแกรม
        type: string
      - name: category
        label: หมวด
        type: select
        options:
          values:
            - { name: lifting, label: "Facial Contour" }
            - { name: skin, label: "Derma Longevity" }
            - { name: scar, label: "Scar Revision & Dermatosurgery" }
            - { name: hair, label: "Hair & Scalp Longevity" }
            - { name: body, label: "Figure Contour" }
            - { name: wellness, label: "Longevity Wellness" }
      - name: subgroup
        label: หมวดย่อย (เฉพาะ Derma Longevity)
        description: "หมวดอื่นไม่ต้องเลือก"
        type: select
        options:
          values:
            - { name: signature, label: "Signature Layers" }
            - { name: hydration, label: "Deep Hydration (HYA)" }
            - { name: regeneration, label: "Skin Regeneration (PN)" }
            - { name: pore, label: "Pore, Texture & Lines" }
            - { name: pigment, label: "Pigment & Tone (ฝ้า กระ จุดด่างดำ)" }
            - { name: devices, label: "Device-Based Longevity" }
            - { name: acne, label: "Acne Care" }
      - name: also_in
        label: แสดงในหมวดย่อยอื่นด้วย
        description: "ไม่ใส่ก็ได้ ใช้เมื่อโปรแกรมเดียวดูแลหลายปัญหา"
        type: select
        options:
          multiple: true
          values:
            - { name: signature, label: "Signature Layers" }
            - { name: hydration, label: "Deep Hydration (HYA)" }
            - { name: regeneration, label: "Skin Regeneration (PN)" }
            - { name: pore, label: "Pore, Texture & Lines" }
            - { name: pigment, label: "Pigment & Tone" }
            - { name: devices, label: "Device-Based Longevity" }
            - { name: acne, label: "Acne Care" }
      - name: image
        label: รูปประกอบ
        description: แนวตั้ง สัดส่วน 4:5 กว้างไม่เกิน 2000px
        type: image
      - name: summary_th
        label: คำอธิบายสั้น (TH)
        type: text
      - name: summary_en
        label: คำอธิบายสั้น (EN)
        type: text
      - name: price_from
        label: ราคาเริ่มต้น
        description: ใส่แค่ตัวเลข เช่น 4900 ถ้าเว้นว่างจะขึ้นว่า "สอบถามราคา"
        type: string
      - name: prices
        label: ตารางราคา
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{item_th}  {price}"
        fields:
          - { name: item_th, label: รายการ (TH), type: string }
          - { name: item_en, label: รายการ (EN), type: string }
          - { name: price, label: ราคา, description: "ใส่ตัวเลข เช่น 4900 หรือ 19/shot หรือ 16900/cc / เว้นว่าง = สอบถามราคา / ใส่ - = ไม่แสดงราคา", type: string }
          - { name: note_th, label: หมายเหตุใต้รายการ (TH), description: "เช่น เฉลี่ย 3,675 บาท/ครั้ง", type: string }
          - { name: note_en, label: หมายเหตุใต้รายการ (EN), type: string }
      - name: suits_th
        label: เหมาะกับใคร (TH)
        type: text
      - name: suits_en
        label: เหมาะกับใคร (EN)
        type: text
      - { name: seo_title_th, label: "ชื่อหน้าสำหรับ Google (TH)", description: "ไม่ใส่ก็ได้ เช่น Ejal40 ฉีดผิวฟื้นฟูโครงสร้าง (ระบบเติม | CHANUN ให้เอง)", type: string }
      - { name: seo_title_en, label: "ชื่อหน้าสำหรับ Google (EN)", type: string }
      - name: faq
        label: คำถามที่พบบ่อย (FAQ)
        description: "ช่วยเรื่อง SEO ใส่ 3–6 ข้อ"
        type: object
        list: true
        fields:
          - { name: q_th, label: คำถาม (TH), type: string }
          - { name: a_th, label: คำตอบ (TH), type: text }
          - { name: q_en, label: คำถาม (EN), type: string }
          - { name: a_en, label: คำตอบ (EN), type: text }
      - name: avoid_th
        label: ไม่ควรทำถ้า (TH)
        type: text
      - name: avoid_en
        label: ไม่ควรทำถ้า (EN)
        type: text
      - name: youtube
        label: ลิงก์ YouTube
        description: ถ้ามี วางลิงก์ได้ทุกแบบ
        type: string
      - name: featured
        label: แสดงในหน้าแรก
        type: boolean
        default: false
      - name: order
        label: ลำดับ
        description: เลขน้อยขึ้นก่อน
        type: number
        default: 50
      - name: published
        label: แสดงบนเว็บ
        type: boolean
        default: true
      - name: body
        label: รายละเอียด (TH)
        type: rich-text
        options:
          format: markdown
      - name: body_en
        label: รายละเอียด (EN)
        type: rich-text
        options:
          format: markdown

  - name: articles
    label: บทความ ข่าว และวิดีโอ
    type: collection
    path: src/content/articles
    filename: "{fields.slug}.md"
    view:
      fields: [title_th, type, date, published]
      primary: title_th
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: slug
        label: ชื่อลิงก์
        description: ภาษาอังกฤษตัวเล็ก ใช้ - แทนช่องว่าง เช่น pn-skin-repair
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: ใช้ได้เฉพาะ a-z 0-9 และ -
      - name: type
        label: ประเภท
        type: select
        options:
          values:
            - { name: article, label: บทความ }
            - { name: news, label: ข่าวคลินิก }
            - { name: video, label: วิดีโอ }
      - name: date
        label: วันที่
        type: date
        options:
          format: yyyy-MM-dd
      - name: title_th
        label: หัวข้อ (TH)
        type: string
        required: true
      - name: title_en
        label: หัวข้อ (EN)
        type: string
      - name: cover
        label: รูปปก
        description: แนวนอน สัดส่วน 3:2
        type: image
      - name: youtube
        label: ลิงก์ YouTube
        description: ถ้าใส่ จะแสดงวิดีโอแทนรูปปกในหน้าบทความ
        type: string
      - name: excerpt_th
        label: เกริ่นนำ (TH)
        description: 1–2 ประโยค
        type: text
      - name: excerpt_en
        label: เกริ่นนำ (EN)
        description: 1–2 ประโยค
        type: text
      - name: sources
        label: แหล่งอ้างอิง
        type: string
        list: true
      - name: published
        label: แสดงบนเว็บ
        type: boolean
        default: true
      - name: body
        label: เนื้อหา (TH)
        type: rich-text
        options:
          format: markdown
      - name: body_en
        label: เนื้อหา (EN)
        type: rich-text
        options:
          format: markdown

  - name: gallery
    label: Before & After (แกลเลอรี)
    type: collection
    path: src/content/gallery
    filename: "{year}-{month}-{day}-{hour}{minute}{second}.md"
    view:
      fields: [program, person, category, published]
      primary: program
      sort: [order]
      default:
        sort: order
        order: asc
    fields:
      - name: images
        label: ภาพ Before & After
        description: "อัปภาพตามที่ สบส. อนุมัติ ใส่ได้สูงสุด 6 ภาพ ห้ามตกแต่งภาพ"
        type: image
        required: true
        options: { multiple: { max: 6 } }
      - { name: program, label: ชื่อโปรแกรม, description: "เช่น Program Precision Point Restructure", type: string, required: true }
      - name: category
        label: หมวด
        type: select
        required: true
        options:
          values:
            - { name: lifting, label: "Facial Contour" }
            - { name: skin, label: "Derma Longevity" }
            - { name: scar, label: "Scar Revision & Dermatosurgery" }
            - { name: hair, label: "Hair & Scalp Longevity" }
            - { name: body, label: "Figure Contour" }
            - { name: wellness, label: "Longevity Wellness" }
      - { name: person, label: ชื่อคนไข้หรือ muse, description: "ไม่ใส่ก็ได้", type: string }
      - { name: is_muse, label: เป็น muse ของคลินิก, type: boolean, default: false }
      - { name: treatment_date, label: วันที่รับบริการ, description: "เช่น 07/04/2025", type: string }
      - name: case
        label: เชื่อมกับบันทึกของคุณหมอ
        description: "ไม่ใส่ก็ได้ ถ้าเลือก ภาพจะมีลิงก์ไปที่เคสนั้น"
        type: reference
        options:
          collection: cases
          value: "{path}"
          label: "{title_th}"
      - { name: order, label: ลำดับ, description: "เลขน้อยขึ้นก่อน", type: number, default: 10 }
      - { name: published, label: แสดงบนเว็บ, type: boolean, default: true }

  - name: cases
    label: Atelier of Muses (บันทึกเคส)
    type: collection
    path: src/content/cases
    filename: "{fields.slug}.md"
    view:
      fields: [title_th, kind, published, date]
      primary: title_th
      sort: [order, date]
      default:
        sort: order
        order: asc
    fields:
      - name: slug
        label: ชื่อลิงก์
        description: ภาษาอังกฤษตัวเล็ก ใช้ - แทนช่องว่าง เช่น muse-mint-skin-trio
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: ใช้ได้เฉพาะ a-z 0-9 และ -
      - name: kind
        label: หมวด
        type: select
        options:
          values:
            - { name: muse, label: "Muses (มีภาพ portrait)" }
            - { name: note, label: "Case Notes (ไม่เปิดเผยใบหน้า)" }
      - name: category
        label: หมวดโปรแกรม (ใช้กรองในแกลเลอรี)
        type: select
        options:
          values:
            - { name: lifting, label: "Facial Contour" }
            - { name: skin, label: "Derma Longevity" }
            - { name: scar, label: "Scar Revision & Dermatosurgery" }
            - { name: hair, label: "Hair & Scalp Longevity" }
            - { name: body, label: "Figure Contour" }
            - { name: wellness, label: "Longevity Wellness" }
      - { name: title_th, label: หัวข้อเคส (TH), type: string, required: true }
      - { name: title_en, label: หัวข้อเคส (EN), type: string }
      - { name: muse_name, label: ชื่อ muse, description: "เฉพาะหมวด Muses", type: string }
      - { name: portrait, label: ภาพ portrait ของ muse, description: "แนวตั้ง 4:5 ห้ามใช้ภาพระหว่างทำหัตถการ", type: image }
      - { name: concern_th, label: สิ่งที่คนไข้กังวล (TH), description: "เขียนเป็นคำพูดของคนไข้", type: text }
      - { name: concern_en, label: สิ่งที่คนไข้กังวล (EN), type: text }
      - { name: assessment_th, label: คุณหมอเห็นอะไร (TH), description: "ประเมินทีละชั้น", type: text }
      - { name: assessment_en, label: คุณหมอเห็นอะไร (EN), type: text }
      - { name: plan_th, label: แผนที่ออกแบบ (TH), type: text }
      - { name: plan_en, label: แผนที่ออกแบบ (EN), type: text }
      - name: programs
        label: โปรแกรมที่ใช้
        type: reference
        options:
          collection: services
          multiple: true
          value: "{path}"
          label: "{name_en}"
      - { name: aftercare_th, label: หลังทำและการดูแลต่อ (TH), type: text }
      - { name: aftercare_en, label: หลังทำและการดูแลต่อ (EN), type: text }
      - { name: before_image, label: ภาพก่อน, description: "จะแสดงเฉพาะเมื่อใส่เลขอนุมัติ สบส. แล้ว ห้ามตกแต่งภาพ", type: image }
      - { name: after_image, label: ภาพหลัง, type: image }
      - { name: ba_images, label: "ภาพก่อน–หลังแบบโพสต์ที่ได้รับอนุมัติ", description: "ใส่ภาพตามที่ สบส. อนุมัติทั้งภาพ (ไม่ต้องแยกก่อน/หลัง) จะแสดงเมื่อใส่เลขอนุมัติแล้ว", type: image, options: { multiple: { max: 6 } } }
      - { name: treatment_date, label: วันที่รับบริการ, description: "เช่น 12 ต.ค. 2569", type: string }
      - { name: photo_date, label: วันที่ถ่ายภาพหลัง, type: string }
      - { name: approval_no, label: เลขที่อนุมัติโฆษณา (ถ้ามีแยก), description: "ไม่ต้องใส่ เว็บใช้เลข ฆสพ. ของทั้งเว็บที่ footer", type: string }
      - { name: date, label: วันที่เผยแพร่, type: date, options: { format: yyyy-MM-dd } }
      - { name: order, label: ลำดับ, type: number, default: 10 }
      - { name: published, label: แสดงบนเว็บ, description: "เปิดเมื่อพร้อมและได้รับความยินยอมเป็นลายลักษณ์อักษรแล้ว", type: boolean, default: false }
      - { name: body, label: บันทึกเพิ่มเติม (TH), type: rich-text, options: { format: markdown } }
      - { name: body_en, label: บันทึกเพิ่มเติม (EN), type: rich-text, options: { format: markdown } }

  - name: doctors
    label: แพทย์
    type: collection
    path: src/content/doctors
    filename: "{fields.name_en}.md"
    view:
      fields: [name_th, role_th]
      primary: name_th
    fields:
      - { name: name_th, label: ชื่อ (TH), type: string, required: true }
      - { name: name_en, label: ชื่อ (EN), type: string }
      - { name: fullname_th, label: ชื่อ-นามสกุลเต็ม (TH), description: "บรรทัดใต้ชื่อ เช่น นายแพทย์...", type: string }
      - { name: fullname_en, label: ชื่อ-นามสกุลเต็ม (EN), type: string }
      - { name: role_th, label: ตำแหน่ง (TH), type: string }
      - { name: role_en, label: ตำแหน่ง (EN), type: string }
      - { name: license, label: เลขใบประกอบวิชาชีพ, type: string }
      - { name: photo, label: รูป (แนวตั้ง 4:5), type: image }
      - { name: order, label: ลำดับ, type: number, default: 1 }
      - { name: body, label: ประวัติ (TH), type: rich-text, options: { format: markdown } }
      - { name: body_en, label: ประวัติ (EN), type: rich-text, options: { format: markdown } }

  - name: home
    label: หน้าแรก
    type: file
    path: src/data/home.json
    format: json
    fields:
      - { name: hero_kicker_th, label: "รูปใหญ่บนสุด: ข้อความเล็ก (TH)", type: string }
      - { name: hero_kicker_en, label: "รูปใหญ่บนสุด: ข้อความเล็ก (EN)", type: string }
      - { name: hero_title_th, label: "รูปใหญ่บนสุด: หัวข้อ (TH) กด Enter เพื่อขึ้นบรรทัดใหม่", type: text }
      - { name: hero_title_en, label: "รูปใหญ่บนสุด: หัวข้อ (EN)", type: text }
      - { name: hero_image, label: "รูปใหญ่บนสุด (แนวนอน กว้าง 2000px ขึ้นไป)", type: image }
      - { name: hero_image_alt_th, label: คำอธิบายรูป (TH), type: string }
      - { name: hero_image_alt_en, label: คำอธิบายรูป (EN), type: string }
      - { name: welcome_title_th, label: "ส่วนต้อนรับ: หัวข้อ (TH)", type: string }
      - { name: welcome_title_en, label: "ส่วนต้อนรับ: หัวข้อ (EN)", type: string }
      - { name: welcome_subtitle_th, label: "ส่วนต้อนรับ: บรรทัดรอง (TH)", type: string }
      - { name: welcome_subtitle_en, label: "ส่วนต้อนรับ: บรรทัดรอง (EN)", type: string }
      - { name: hero_text_th, label: "ส่วนต้อนรับ: ข้อความ (TH)", type: text }
      - { name: hero_text_en, label: "ส่วนต้อนรับ: ข้อความ (EN)", type: text }
      - { name: banner_image, label: "แบนเนอร์รูปกว้าง (แนวนอน)", type: image }
      - { name: banner_small_th, label: "แบนเนอร์: ข้อความเล็ก (TH)", type: string }
      - { name: banner_small_en, label: "แบนเนอร์: ข้อความเล็ก (EN)", type: string }
      - { name: banner_title_th, label: "แบนเนอร์: หัวข้อ (TH)", type: string }
      - { name: banner_title_en, label: "แบนเนอร์: หัวข้อ (EN)", type: string }
      - name: pillars
        label: "3 ช่องรูปพร้อมข้อความ (จุดเด่นของคลินิก)"
        type: object
        list:
          max: 3
          collapsible:
            collapsed: true
            summary: "{title_th}"
        fields:
          - { name: title_th, label: หัวข้อ (TH), type: string }
          - { name: title_en, label: หัวข้อ (EN), type: string }
          - { name: text_th, label: ข้อความ (TH), type: text }
          - { name: text_en, label: ข้อความ (EN), type: text }
          - { name: image, label: "รูป (แนวตั้ง)", type: image }
      - { name: philosophy_title_th, label: "แนวคิดคลินิก: หัวข้อ (TH)", type: string }
      - { name: philosophy_title_en, label: "แนวคิดคลินิก: หัวข้อ (EN)", type: string }
      - { name: philosophy_text_th, label: "แนวคิดคลินิก: ข้อความ (TH)", type: text }
      - { name: philosophy_text_en, label: "แนวคิดคลินิก: ข้อความ (EN)", type: text }
      - { name: interior_image, label: "รูปเต็มจอ (บรรยากาศคลินิก แนวนอน)", type: image }
      - { name: interior_image_alt_th, label: คำอธิบายรูป (TH), type: string }
      - { name: interior_image_alt_en, label: คำอธิบายรูป (EN), type: string }
      - { name: featured_video, label: ลิงก์ YouTube ที่จะโชว์หน้าแรก, type: string }
